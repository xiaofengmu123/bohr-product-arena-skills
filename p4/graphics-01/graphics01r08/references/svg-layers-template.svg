<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reusable layered SVG skeleton for sci-figure-workflow.
  Content placeholders are EMPTY: fill every node, edge, group, label and
  legend item from the source material, each backed by a provenance entry.
  Keep the layer ids stable so reviewers can toggle layers without redrawing.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="180mm" height="90mm" viewBox="0 0 680 340"
     font-family="Arial, 'Noto Sans', 'Noto Sans CJK SC', sans-serif"
     xml:lang="en">
  <defs>
    <!-- activation / positive edge arrowhead -->
    <marker id="arrow-positive" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <!-- inhibition / negative edge bar -->
    <marker id="arrow-negative" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L9,9 M1,9 L9,1" stroke="#222222" stroke-width="2"/>
    </marker>
    <style>
      .node { fill: #f5f5f5; stroke: #222222; stroke-width: 1.2; }
      .group { fill: none; stroke: #888888; stroke-width: 1; stroke-dasharray: 4 3; }
      .edge { fill: none; stroke: #222222; stroke-width: 1.2; }
      .label { font-size: 10px; fill: #111111; }
      .title { font-size: 14px; font-weight: bold; fill: #111111; }
      .note { font-size: 8px; fill: #444444; }
    </style>
  </defs>

  <title>figure01 (content to be filled from source material)</title>

  <!-- layer 1: containment groups / zones (drawn first, under everything) -->
  <g id="layer-groups"></g>

  <!-- layer 2: nodes / entities -->
  <g id="layer-nodes"></g>

  <!-- layer 3: edges / relations (arrows must carry direction) -->
  <g id="layer-edges"></g>

  <!-- layer 4: labels / annotations / units -->
  <g id="layer-labels"></g>

  <!-- layer 5: legend (items MUST come from the same entities table) -->
  <g id="layer-legend"></g>
</svg>
